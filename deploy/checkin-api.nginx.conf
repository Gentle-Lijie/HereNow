# Replace __API_PROXY_SECRET__ only in the root-readable server copy, never in Git.
map $http_x_herenow_proxy_secret $herenow_proxy_authorized {
    default 0;
    ~^__API_PROXY_SECRET__$ 1;
}
map $herenow_proxy_authorized $herenow_client_ip {
    default $remote_addr;
    1 $http_x_herenow_client_ip;
}

server {
    listen 80;
    server_name checkin-api.lijie.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name checkin-api.lijie.space;
    ssl_certificate /www/server/panel/vhost/cert/lijie.space/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/lijie.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 6m;

    location = /api/health {
        proxy_pass http://127.0.0.1:3018;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        if ($herenow_proxy_authorized = 0) { return 403; }
        proxy_pass http://127.0.0.1:3018;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $herenow_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Herenow-Proxy-Secret "";
        proxy_set_header X-Herenow-Client-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_buffering off;
        proxy_cache off;
    }
    location / { return 404; }
    # API paths/query strings, Cookies, tokens and forms do not enter access logs.
    access_log off;
    error_log /www/wwwlogs/herenow-api.error.log crit;
}
